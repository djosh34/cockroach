name: setup-go
description: Installs the Go toolchain of go.mod and restores the module cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}
